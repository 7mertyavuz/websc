name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    
    # GitHub Actions içinde testler için geçici bir PostgreSQL servisi başlatıyoruz
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scrape
          POSTGRES_PASSWORD: scrape
          POSTGRES_DB: scrapehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # Testler artık GitHub'ın kendi ayağa kaldırdığı PostgreSQL üzerinde çalışacak
        env:
          DATABASE_URL: postgresql+psycopg2://scrape:scrape@localhost:5432/scrapehub
        run: pytest -q
